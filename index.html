<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Story ❤️</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* شاشة الافتتاح */

        #intro {
            position: fixed;
            inset: 0;

            background: linear-gradient(
                135deg,
                #ff9a9e,
                #fad0c4
            );

            display: none;

            justify-content: center;
            align-items: center;

            text-align: center;

            z-index: 99999;

            color: white;
        }

        .intro-content {
            animation: introAppear 1.2s ease;
        }

        .intro-heart {
            font-size: 80px;

            animation: heartBeat 1.5s infinite;
        }

        .intro-content h1 {
            font-size: 42px;
            margin: 20px 0 10px;
        }

        .intro-content p {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .intro-content small {
            font-size: 16px;
            opacity: 0.9;
        }

        @keyframes introAppear {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes heartBeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

        }

        /* الموبايل */

        @media (max-width: 600px) {

            .intro-content h1 {
                font-size: 32px;
            }

            .intro-content p {
                font-size: 19px;
            }

            .intro-heart {
                font-size: 65px;
            }

        }

    </style>

</head>


<body>


    <!-- 🔐 شاشة إدخال التاريخ -->

    <div class="lock-screen" id="lockScreen">

        <div class="lock">🔐</div>

        <h1>Our Story ❤️</h1>

        <p>
            اكتبي تاريخ اليوم اللي بدأت فيه حكايتنا
        </p>

        <input
            type="text"
            id="password"
            placeholder="DD/MM/YYYY"
        >

        <button onclick="unlock()">
            فتح 🔓
        </button>

        <p id="error"></p>

    </div>


    <!-- 🎬 مشهد الافتتاح -->

    <div id="intro">

        <div class="intro-content">

            <div class="intro-heart">
                ❤️
            </div>

            <h1>
                31/10/2025
            </h1>

            <p>
                ومن هنا بدأت الحكاية...
            </p>

            <small>
                استعدي ❤️✨
            </small>

        </div>

    </div>


    <script>

        function unlock() {

            const password =
                document.getElementById("password").value.trim();

            const error =
                document.getElementById("error");

            const lockScreen =
                document.getElementById("lockScreen");

            const intro =
                document.getElementById("intro");


            if (password === "31/10/2025") {

                /* إخفاء شاشة القفل */

                lockScreen.style.display = "none";


                /* إظهار المشهد */

                intro.style.display = "flex";


                /* بعد 4 ثواني ندخل الموقع */

                setTimeout(function () {

                    window.location.href = "home.html";

                }, 4000);


            } else {

                error.innerText =
                    "التاريخ غلط ❤️";

            }

        }

    </script>


</body>

</html>
