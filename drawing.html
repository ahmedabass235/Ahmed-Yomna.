```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسمة يمني ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #030305;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
    gap: 20px;
}

h1 {
    color: #ff8fbd;
    text-shadow: 0 0 15px #ff247f;
    font-size: clamp(25px, 6vw, 38px);
    text-align: center;
}

.subtitle {
    color: #e8cbd8;
    text-align: center;
    font-size: 15px;
}

.picture-frame {
    width: min(88vw, 440px);
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid #ff6da8;
    box-shadow: 0 0 25px #ff247f55;
    background: #000;
}

#portrait {
    width: 100%;
    display: block;
    opacity: 0;
}

#drawingCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.message {
    font-size: clamp(17px, 4vw, 23px);
    color: #ffb2d0;
    text-align: center;
    opacity: 0;
    transform: translateY(12px);
    transition: 1.5s;
}

.message.show {
    opacity: 1;
    transform: translateY(0);
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

button {
    border: 1px solid #ff6da8;
    background: linear-gradient(135deg, #ff78ae, #d62472);
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #ff247f33;
}

button:hover {
    transform: scale(1.04);
}

.back {
    background: transparent;
}

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<main class="container">

    <h1>رسمة يمني ❤️</h1>

    <p class="subtitle">
        استني اللحظة دي... كل نقطة بتقرّب ملامحك ❤️✨
    </p>

    <div class="picture-frame">
        <img id="portrait"
             src="drawing-yemeni.png"
             alt="رسمة يمني الفنية">

        <canvas id="drawingCanvas"></canvas>
    </div>

    <p id="message" class="message">
        كل تفصيلة فيكي ليها حكاية ❤️
    </p>

    <div class="buttons">
        <button onclick="startDrawing()">
            ✨ ارسم من الأول
        </button>

        <button onclick="toggleMusic()" id="musicButton">
            🎵 شغّل الأغنية
        </button>

        <button class="back"
                onclick="location.href='home.html'">
            🏠 رجوع للموقع
        </button>
    </div>

</main>

<script>
const portrait = document.getElementById("portrait");
const message = document.getElementById("message");
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

const drawingCanvas = document.getElementById("drawingCanvas");
const drawCtx = drawingCanvas.getContext("2d");

let dots = [];
let animationFrame = null;
let startTime = 0;
let drawingReady = false;
const duration = 9000;

function prepareDrawing() {
    const width = portrait.naturalWidth;
    const height = portrait.naturalHeight;

    if (!width || !height) return;

    // نصغّر الصورة عشان الرسم يبقى سلس على اللاب والموبايل
    const scale = Math.min(1, 600 / width);
    const w = Math.round(width * scale);
    const h = Math.round(height * scale);

    drawingCanvas.width = w;
    drawingCanvas.height = h;

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = w;
    tempCanvas.height = h;

    const tempCtx = tempCanvas.getContext("2d", {
        willReadFrequently: true
    });

    tempCtx.drawImage(portrait, 0, 0, w, h);

    const pixels = tempCtx.getImageData(0, 0, w, h).data;
    dots = [];

    // ناخد نقاط من تفاصيل الصورة المضيئة
    for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
            const i = (y * w + x) * 4;

            const r = pixels[i];
            const g = pixels[i + 1];
            const b = pixels[i + 2];
            const a = pixels[i + 3];

            const brightness = (r + g + b) / 3;

            // تجاهل الخلفية السوداء وخد تفاصيل الرسم
            if (a > 100 && brightness > 38) {
                dots.push({
                    x,
                    y,
                    r,
                    g,
                    b,
                    brightness,
                    startX: Math.random() * w,
                    startY: Math.random() * h,
                    size: 0.45 + brightness / 180
                });
            }
        }
    }

    // ترتيب عشوائي عشان النقط تظهر في أماكن مختلفة
    for (let i = dots.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dots[i], dots[j]] = [dots[j], dots[i]];
    }

    drawingReady = true;
    startDrawing();
}

function startDrawing() {
    if (!drawingReady) return;

    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
    }

    message.classList.remove("show");
    startTime = performance.now();

    // كل إعادة رسم تبدأ من أماكن عشوائية جديدة
    dots.forEach(dot => {
        dot.startX = Math.random() * drawingCanvas.width;
        dot.startY = Math.random() * drawingCanvas.height;
    });

    animateDrawing(startTime);
}

function animateDrawing(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    const w = drawingCanvas.width;
    const h = drawingCanvas.height;

    drawCtx.clearRect(0, 0, w, h);

    // ظهور تدريجي للنقط مع تجمّعها في مكانها الصحيح
    const visibleCount = Math.floor(dots.length * progress);

    for (let i = 0; i < visibleCount; i++) {
        const dot = dots[i];

        // كل نقطة تتحرك من مكان عشوائي إلى موقعها في الصورة
        const localProgress = Math.max(
            0,
            Math.min(1, (progress * 1.35) - (i / dots.length) * 0.35)
        );

        const eased = 1 - Math.pow(1 - localProgress, 3);

        const x = dot.startX + (dot.x - dot.startX) * eased;
        const y = dot.startY + (dot.y - dot.startY) * eased;

        const alpha = Math.min(1, localProgress + 0.15);
        const radius = dot.size * (0.45 + eased * 0.55);

        drawCtx.globalAlpha = alpha;

        // هالة وردية مضيئة حول كل نقطة
        drawCtx.shadowBlur = 5;
        drawCtx.shadowColor = "#ff398f";

        drawCtx.fillStyle =
            `rgb(${dot.r},${dot.g},${dot.b})`;

        drawCtx.beginPath();
        drawCtx.arc(x, y, radius, 0, Math.PI * 2);
        drawCtx.fill();
    }

    drawCtx.globalAlpha = 1;
    drawCtx.shadowBlur = 0;

    if (progress < 1) {
        animationFrame = requestAnimationFrame(animateDrawing);
    } else {
        // لمعة أخيرة بعد اكتمال الرسم
        drawCtx.shadowBlur = 0;
        message.classList.add("show");
        animationFrame = null;
    }
}

function toggleMusic() {
    if (music.paused) {
        music.play().then(() => {
            musicButton.textContent = "⏸ إيقاف الأغنية";
        }).catch(() => {
            alert("تأكد إن ملف song.mp3 موجود في مجلد الموقع.");
        });
    } else {
        music.pause();
        musicButton.textContent = "🎵 شغّل الأغنية";
    }
}

portrait.addEventListener("load", prepareDrawing);

portrait.addEventListener("error", () => {
    alert("تأكد إن صورة الرسم باسم drawing-yemeni.png بجانب drawing.html");
});

// لو الصورة محمّلة قبل تشغيل الكود
if (portrait.complete && portrait.naturalWidth > 0) {
    prepareDrawing();
}

// النجوم المتحركة في الخلفية
const stars = document.getElementById("stars");
const starCtx = stars.getContext("2d");
let particles = [];

function resizeStars() {
    stars.width = window.innerWidth;
    stars.height = window.innerHeight;

    particles = Array.from({ length: 65 }, () => ({
        x: Math.random() * stars.width,
        y: Math.random() * stars.height,
        r: Math.random() * 2 + 0.5,
        a: Math.random()
    }));
}

function animateStars() {
    starCtx.clearRect(0, 0, stars.width, stars.height);

    particles.forEach(p => {
        p.a += (Math.random() - 0.5) * 0.08;
        p.a = Math.max(0.15, Math.min(1, p.a));

        starCtx.beginPath();
        starCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(255,140,190,${p.a})`;
        starCtx.shadowBlur = 10;
        starCtx.shadowColor = "#ff247f";
        starCtx.fill();
    });

    requestAnimationFrame(animateStars);
}

window.addEventListener("resize", resizeStars);
resizeStars();
animateStars();
</script>
<script src="script.js"></script>
</body>
</html>
