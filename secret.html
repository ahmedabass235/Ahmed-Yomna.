<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار حكايتنا ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<div
    onclick="findMissionSymbol('key')"
    style="
        position:fixed;
        top:25px;
        right:25px;
        font-size:22px;
        cursor:pointer;
        opacity:0.8;
        z-index:1000;
    "
>
    🔑
</div>

<script>
function findMissionSymbol(symbol) {

    let found =
        JSON.parse(localStorage.getItem("missionSymbols")) || [];

    if (!found.includes(symbol)) {

        found.push(symbol);

        localStorage.setItem(
            "missionSymbols",
            JSON.stringify(found)
        );

        alert("لقيتي رمز جديد! 🔑🔥");
    }
}
</script>

<body>
    <audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
    <script src="script.js"></script>
    </audio>

<button class="music-btn" onclick="toggleMusic()">
    🎵
</button>

<div class="secret-page">

    <div class="secret-heart">❤️</div>

    <h1>قد إيه إنتِ عارفة حكايتنا؟ 👀</h1>

    <p class="secret-intro">
        جاوبي على الأسئلة وشوفي نتيجتك 😂❤️
    </p>

    <div class="question-card">

        <div class="question-number">
            السؤال <span id="questionNumber">1</span> من 6
        </div>

        <h2 id="question"></h2>

        <input
            type="text"
            id="userAnswer"
            placeholder="اكتبي إجابتك هنا ❤️"
            autocomplete="off"
        >

        <button onclick="checkAnswer()">
            تأكيد الإجابة ✅
        </button>

        <div id="result"></div>

        <button id="nextButton" onclick="nextQuestion()">
            السؤال اللي بعده ➜
        </button>

    </div>

    <div id="finalMessage">

        <div class="big-heart">❤️</div>

        <h2>خلصنا! 😂❤️</h2>

        <p id="score"></p>

        <p>
            مهما كانت النتيجة...
            <br>
            إنتِ جزء من أحلى حكاية ❤️
        </p>

        <button onclick="location.href='home.html'">
            نرجع لحكايتنا 🏠
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "مين اعترف بحبه للتاني الأول؟ 😂",
        answers: ["يمني"]
    },

    {
        question: "يوم ما أنا قولتلك بحبك كان يوم كام؟ ❤️",
        answers: ["6/1/2026", "06/01/2026"]
    },

    {
        question: "يوم تعارفنا كان يوم كام؟ 🗓️",
        answers: ["31/10/2025"]
    },

    {
        question: "مين بدأ الحكاية؟ 👀",
        answers: ["احنا الاتنين", "إحنا الاتنين"]
    },

    {
        question: "اسم الموقع ده إيه؟ ❤️",
        answers: ["our story", "حكايتنا", "ذكرياتنا"]
    },

    {
        question: "إيه أكتر حاجة مميزة في حكايتنا؟ ✨",
        answers: ["حبنا", "الحب", "حكايتنا", "تمسكنا ببعض"]
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

const question = document.getElementById("question");
const answerInput = document.getElementById("userAnswer");
const result = document.getElementById("result");
const nextButton = document.getElementById("nextButton");

function loadQuestion() {

    question.innerText = questions[currentQuestion].question;

    document.getElementById("questionNumber").innerText =
        currentQuestion + 1;

    answerInput.value = "";

    result.innerText = "";

    nextButton.style.display = "none";

    answerInput.disabled = false;

    answered = false;

    answerInput.focus();
}

function checkAnswer() {

    if (answered) return;

    const userAnswer =
        answerInput.value.trim().toLowerCase();

    if (userAnswer === "") {
        result.innerText = "اكتبي إجابة الأول 😂❤️";
        result.className = "wrong";
        return;
    }

    const correctAnswers =
        questions[currentQuestion].answers;

    const correct =
        correctAnswers.some(answer =>
            userAnswer === answer.toLowerCase()
        );

    if (correct) {

        score++;

        result.innerText = "صح يا يموونتي ❤️"; 
        result.className = "correct";

    } else {

        result.innerText =
            "غلط 😂❤️ الإجابة كانت: " +
            correctAnswers[0];

        result.className = "wrong";
    }

    answered = true;

    answerInput.disabled = true;

    nextButton.style.display = "inline-block";
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        document.querySelector(".question-card").style.display = "none";

        document.getElementById("finalMessage").style.display = "block";

        document.getElementById("score").innerText =
            "نتيجتك: " + score + " / " + questions.length + " ❤️";

        return;
    }

    loadQuestion();
}

loadQuestion();

</script>
<script src="script.js"></script>
<script>
function findMissionSymbol(symbol) {

    let found = JSON.parse(
        sessionStorage.getItem("missionSymbols") || "[]"
    );

    if (!found.includes(symbol)) {

        found.push(symbol);

        sessionStorage.setItem(
            "missionSymbols",
            JSON.stringify(found)
        );

        alert("🔓 لقيتي رمز سري! ❤️");
    }
}
</script>
<div
    onclick="findMissionSymbol('key')"
    style="
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 35px;
        cursor: pointer;
        z-index: 9999;
    "
>
    🔑
</div>
</body>
</html>
